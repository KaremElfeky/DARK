<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مهامي</title>
  <meta name="description" content="قائمة مهام سهلة: اكتب بالكيبورد أو بقلم الآيباد، وهفكرك قبل كل مهمة بيوم وبساعة.">
  <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مهامي">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>مهامي</h1>
        <p id="todayLabel" class="today"></p>
      </div>
      <div class="top-actions">
        <button type="button" id="bellBtn" class="icon-btn" aria-label="الإشعارات"></button>
        <button type="button" id="settingsBtn" class="icon-btn" aria-label="الإعدادات">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banners" aria-live="polite"></div>

    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-row">
        <label class="sr-only" for="newTitle">مهمة جديدة</label>
        <input id="newTitle" name="title" type="text" dir="rtl" enterkeyhint="done" autocomplete="off"
               placeholder="ضيف مهمة… مثلاً: اتصل بماما بكرة ٥م">
        <button type="button" id="whenBtn" class="when-btn" aria-label="اختار ميعاد">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <button type="submit" class="add-btn" aria-label="ضيف المهمة">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="composerPreview" class="composer-preview" hidden></div>
    </form>

    <main id="list" class="list"></main>
  </div>

  <button type="button" id="penFab" class="fab">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20z"/><path d="M14.2 6.8l3 3"/></svg>
    <span>اكتب بالقلم</span>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">مهامي محتاج JavaScript عشان يشتغل.</p></noscript>
</body>
</html>
